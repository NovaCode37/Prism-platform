name: Stale pull requests

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1
          days-before-pr-stale: 45
          days-before-pr-close: 14
          exempt-pr-labels: "pinned,blocked"
          stale-pr-label: stale
          stale-pr-message: >
            No movement here for a month and a half, so this is marked stale.
            Push a commit or leave a comment and it stays open, otherwise it
            closes in two weeks. Reopening later is fine.
          close-pr-message: >
            Closing this since it went quiet. Not a judgement on the idea —
            reopen whenever you want to pick it back up.
